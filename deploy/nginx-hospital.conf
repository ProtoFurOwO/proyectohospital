# ═══════════════════════════════════════════════════════════
#  Nginx – Sistema Hospitalario
#  Proxy reverso al backend via VPC + Frontend estático
#  
#  IMPORTANTE: Los trailing slashes en proxy_pass son CLAVE.
#  Nginx strip-ea el prefijo /svc/xxx/ y reenvía solo el
#  path real al backend.
# ═══════════════════════════════════════════════════════════

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name DOMAIN_PLACEHOLDER;

    # ── Frontend estático (React/Vite build) ──
    root /var/www/hospital;
    index index.html;

    # ── SPA: todas las rutas al index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ══════════════════════════════════════════
    #  PROXY REVERSO – Backend via VPC
    #  /svc/citas/xxx  →  10.0.1.5:8001/xxx
    # ══════════════════════════════════════════

    # Citas (Python/FastAPI → MySQL)
    location /svc/citas/ {
        proxy_pass http://BACKEND_VPC_IP:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Expedientes (Python/FastAPI → PostgreSQL)
    location /svc/expedientes/ {
        proxy_pass http://BACKEND_VPC_IP:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Quirófanos (Go → RAM)
    location /svc/quirofanos/ {
        proxy_pass http://BACKEND_VPC_IP:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Personal (Python/FastAPI → Redis)
    location /svc/personal/ {
        proxy_pass http://BACKEND_VPC_IP:8005/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Compilador SQL + Login + Logs (Go)
    location /svc/compiler/ {
        proxy_pass http://BACKEND_VPC_IP:8006/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Compilador UI legacy (acceso directo) ──
    location /compiler/ {
        proxy_pass http://BACKEND_VPC_IP:8006/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ══════════════════════════════════════════
    #  SWAGGER DOCS (Para el profesor)
    # ══════════════════════════════════════════
    location /docs/citas { return 301 /svc/citas/docs; }
    location /docs/expedientes { return 301 /svc/expedientes/docs; }
    location /docs/personal { return 301 /svc/personal/docs; }
}
