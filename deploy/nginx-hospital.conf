# ═══════════════════════════════════════════════════════════
#  Nginx – Configuración del Sistema Hospitalario
#  Proxy reverso al backend via VPC + Frontend estático
# ═══════════════════════════════════════════════════════════

server {
    listen 80;
    server_name DOMAIN_PLACEHOLDER;

    # ── Frontend estático (React/Vite build) ──
    root /var/www/hospital;
    index index.html;

    # ── SPA: Redirigir todas las rutas al index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API Proxy: Citas (Python/FastAPI → MySQL) ──
    location /api/v1/citas {
        proxy_pass http://BACKEND_VPC_IP:8001/citas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API Proxy: Expedientes (Python/FastAPI → PostgreSQL) ──
    location /api/v1/expedientes {
        proxy_pass http://BACKEND_VPC_IP:8002/expedientes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API Proxy: Quirófanos (Go → RAM/MariaDB) ──
    location /api/v1/quirofanos {
        proxy_pass http://BACKEND_VPC_IP:8003/quirofanos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API Proxy: Personal (Python/FastAPI → Redis) ──
    location /api/v1/personal {
        proxy_pass http://BACKEND_VPC_IP:8005/personal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API Proxy: Compilador SQL + Login + Logs ──
    location /api/v1/compiler/ {
        proxy_pass http://BACKEND_VPC_IP:8006/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Compilador UI (legacy page) ──
    location /compiler/ {
        proxy_pass http://BACKEND_VPC_IP:8006/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health checks directos ──
    location /api/v1/health/citas {
        proxy_pass http://BACKEND_VPC_IP:8001/health;
    }
    location /api/v1/health/expedientes {
        proxy_pass http://BACKEND_VPC_IP:8002/health;
    }
    location /api/v1/health/quirofanos {
        proxy_pass http://BACKEND_VPC_IP:8003/health;
    }
    location /api/v1/health/personal {
        proxy_pass http://BACKEND_VPC_IP:8005/health;
    }
    location /api/v1/health/compiler {
        proxy_pass http://BACKEND_VPC_IP:8006/health;
    }
}
